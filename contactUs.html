<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactează-ne</title>

<style>
    /* Resetare și font modern */
    body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: #333;
    }

    h1 {
        margin-bottom: 30px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    /* Container pentru butoane */
    .container {
        width: 90%;
        max-width: 400px;
        text-align: center;
    }

    /* Stil de bază pentru butoane */
    .button {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 15px 0;
        padding: 16px;
        font-size: 17px;
        font-weight: 600;
        text-decoration: none;
        color: white;
        border-radius: 12px;
        transition: all 0.3s ease; /* Tranziție fină */
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* Efect de hover general */
    .button:hover {
        transform: translateY(-3px); /* Se ridică puțin */
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        filter: brightness(1.1);
    }

    /* Culori specifice */
    .whatsapp {
        background: #25D366;
    }

    .instagram {
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    /* Footer discret */
    .footer {
        margin-top: 40px;
        font-size: 14px;
        color: #888;
    }
</style>
</head>

<body>

    <div class="container">
        <h1>Contactează-ne</h1>

        <a class="button whatsapp" href="https://wa.me/353871753925">
            Contact pe WhatsApp
        </a>

        <a class="button instagram" href="https://instagram.com/picaturi_de_speranta.ie">
            Pagina Instagram
        </a>

        <p class="footer">Te așteptăm cu drag!</p>
    </div>

</body>
</html>
